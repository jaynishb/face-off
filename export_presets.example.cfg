[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1D2B36; overscroll-behavior: none; }
  /* Face Off is PORTRAIT-locked: two players share one phone held upright
     between them, with the top player's half rotated 180 degrees in-engine.
     A phone browser cannot force an orientation the way a native app can,
     and CSS-rotating the canvas itself was tried and rejected: Godot's web
     input reads touch/click position off the canvas's post-transform
     getBoundingClientRect() and maps it onto the canvas's pre-transform
     pixel buffer, so a rotated canvas silently scrambles every tap
     coordinate -- the 'no controls' bug this project has already shipped
     once (see CLAUDE.md). So the canvas is never transformed; instead a
     full-screen prompt covers it and asks for a physical rotation whenever
     the viewport is in LANDSCAPE. Note the media query below is the
     inverse of what it was pre-portrait -- it is easy to leave stale, and
     nothing about it fails to compile if you do. */
  #rotate-prompt {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #1D2B36;
    color: #FFFDF7;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  #rotate-prompt .icon { font-size: 64px; animation: rotate-hint 1.6s ease-in-out infinite; margin-bottom: 16px; }
  #rotate-prompt p { font-size: 18px; max-width: 320px; line-height: 1.4; }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  @media screen and (orientation: landscape) {
    #rotate-prompt { display: flex; }
  }
</style>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var prompt = document.createElement('div');
    prompt.id = 'rotate-prompt';
    prompt.innerHTML = '<div class=\"icon\">&#128241;</div><p>Hold your phone upright --<br>Face Off is played in portrait, one player at each end.</p>';
    document.body.appendChild(prompt);
  });
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
